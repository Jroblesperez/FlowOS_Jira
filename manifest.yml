modules:
  jira:globalPage:
    - key: flowos-executive-workspace
      resource: main
      resolver:
        function: resolver
      title: FlowOS Executive Workspace
  jira:adminPage:
    - key: flowos-configuration
      resource: main
      resolver:
        function: resolver
      title: FlowOS Configuration
  function:
    - key: resolver
      handler: src/resolver.handler
resources:
  - key: main
    path: dist
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/flowos-agile-command-center
permissions:
  scopes:
    - read:jira-work
    - storage:app
